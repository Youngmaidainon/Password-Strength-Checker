<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-grid"></div>
    <div class="container">
        <div class="header">
            <div class="shield-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
            </div>
            <h1>Password<span class="accent">Guard</span></h1>
            <p class="subtitle">ตรวจสอบความปลอดภัยของรหัสผ่าน</p>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" id="password" placeholder="กรอกรหัสผ่านของคุณ..." autocomplete="off"
                    spellcheck="false">
                <button type="button" id="toggleIcon" aria-label="แสดง/ซ่อน รหัสผ่าน">
                    <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        style="display:none">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="strength-section">
            <div class="strength-label">
                <span class="strength-title">ความแข็งแรง</span>
                <span id="strength-text" class="strength-value">รอการตรวจสอบ...</span>
            </div>
            <div class="strength-bars">
                <div class="bar" id="bar-1"></div>
                <div class="bar" id="bar-2"></div>
                <div class="bar" id="bar-3"></div>
                <div class="bar" id="bar-4"></div>
                <div class="bar" id="bar-5"></div>
            </div>
        </div>

        <div class="checklist">
            <div class="check-item" id="check-length">
                <span class="check-icon">○</span>
                <span>ความยาวอย่างน้อย 8 ตัวอักษร</span>
            </div>
            <div class="check-item" id="check-upper">
                <span class="check-icon">○</span>
                <span>มีตัวพิมพ์ใหญ่ (A-Z)</span>
            </div>
            <div class="check-item" id="check-lower">
                <span class="check-icon">○</span>
                <span>มีตัวพิมพ์เล็ก (a-z)</span>
            </div>
            <div class="check-item" id="check-number">
                <span class="check-icon">○</span>
                <span>มีตัวเลข (0-9)</span>
            </div>
            <div class="check-item" id="check-special">
                <span class="check-icon">○</span>
                <span>มีอักขระพิเศษ (!@#$...)</span>
            </div>
            <div class="check-item" id="check-nospace">
                <span class="check-icon">○</span>
                <span>ไม่มีช่องว่าง</span>
            </div>
            <div class="check-item" id="check-norepeat">
                <span class="check-icon">○</span>
                <span>ไม่มีตัวซ้ำเกิน 2 ครั้ง</span>
            </div>
        </div>

        <button type="button" id="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            ตรวจสอบใน HaveIBeenPwned
        </button>

        <div id="result" class="result-box hidden"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
